<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glass of the tile: see-through blue, lighter towards the bottom glow. -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.92" />
      <stop offset="0.48" stop-color="#3fa9f5" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#1583df" stop-opacity="0.92" />
      <stop offset="1" stop-color="#0b4fb0" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#9fd8ff" />
      <stop offset="1" stop-color="#0a3a8c" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#b6fbff" stop-opacity="0.95" />
      <stop offset="0.6" stop-color="#4fd3ff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#4fd3ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="body" cx="0.36" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#fffbc4" />
      <stop offset="0.35" stop-color="#ffe033" />
      <stop offset="0.8" stop-color="#f7a400" />
      <stop offset="1" stop-color="#c96a00" />
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a" />
      <stop offset="1" stop-color="#d87900" />
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc061" />
      <stop offset="0.5" stop-color="#ff7a1a" />
      <stop offset="1" stop-color="#c63e00" />
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4bfd2" />
      <stop offset="0.28" stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#eef2f8" />
      <stop offset="1" stop-color="#93a0b8" />
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4a66" />
      <stop offset="0.3" stop-color="#b7c4dc" />
      <stop offset="1" stop-color="#2f3a54" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="mirror">
      <rect x="0" y="446" width="512" height="66" fill="url(#fade)" />
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <clipPath id="inside">
      <rect x="30" y="30" width="452" height="452" rx="96" />
    </clipPath>
    <g id="duck">
      <path d="M92 356 Q70 300 78 282 Q120 300 168 334 Z" />
      <ellipse cx="248" cy="376" rx="156" ry="84" />
      <circle cx="318" cy="270" r="84" />
    </g>
    <g id="tophat">
      <ellipse cx="308" cy="198" rx="112" ry="22" transform="rotate(-9 308 198)" />
      <path d="M244 204 L228 102 Q266 76 322 88 Q352 94 370 84 L384 182 Q314 216 244 204 Z" />
    </g>
    <g id="whole">
      <use href="#duck" fill="url(#body)" />
      <use href="#tophat" fill="url(#hat)" />
    </g>
  </defs>

  <!-- Shadow of the tile on the desktop. -->
  <rect x="40" y="52" width="432" height="440" rx="96" fill="#02122e" opacity="0.5" filter="url(#softer)" />

  <!-- The glass tile. -->
  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#edge)" />
  <rect x="30" y="30" width="452" height="452" rx="96" fill="url(#glass)" />
  <g clip-path="url(#inside)">
    <ellipse cx="256" cy="500" rx="320" ry="190" fill="url(#glow)" />
    <!-- Light crossing the glass at an angle. -->
    <rect x="-120" y="150" width="760" height="46" fill="url(#streak)" transform="rotate(-32 256 256)" />
    <rect x="-120" y="250" width="760" height="18" fill="url(#streak)" transform="rotate(-32 256 256)" />
    <!-- The duck mirrored on the glass floor. -->
    <g mask="url(#mirror)">
      <use href="#whole" transform="translate(0 908) scale(1 -1)" />
    </g>
    <ellipse cx="250" cy="452" rx="150" ry="13" fill="#04235f" opacity="0.55" filter="url(#soft)" />
  </g>

  <!-- The duck: no hard outline, only a soft dark edge. -->
  <use href="#duck" fill="#7a3d00" opacity="0.55" filter="url(#soft)" transform="translate(0 6)" />
  <use href="#duck" fill="#a85a00" stroke="#a85a00" stroke-width="6" stroke-linejoin="round" />
  <use href="#duck" fill="url(#body)" />
  <path d="M148 378 Q172 318 252 332 Q296 342 296 378 Q262 430 202 424 Q160 418 148 378 Z" fill="url(#wing)" />
  <path d="M162 366 Q188 332 248 340" fill="none" stroke="#fff6b8" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  <!-- Wet shine on head, back and chest. -->
  <ellipse cx="284" cy="228" rx="40" ry="22" fill="#ffffff" opacity="0.72" transform="rotate(-26 284 228)" />
  <ellipse cx="196" cy="326" rx="60" ry="15" fill="#ffffff" opacity="0.5" transform="rotate(-14 196 326)" />
  <path d="M330 420 Q370 404 390 366" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.35" />
  <!-- Beak. -->
  <ellipse cx="410" cy="288" rx="50" ry="25" fill="#9c3600" />
  <ellipse cx="410" cy="287" rx="45" ry="20" fill="url(#beak)" />
  <ellipse cx="402" cy="277" rx="27" ry="6" fill="#ffffff" opacity="0.75" />
  <path d="M368 291 Q410 301 452 289" fill="none" stroke="#a83a00" stroke-width="4" stroke-linecap="round" />
  <!-- Eye. -->
  <circle cx="346" cy="256" r="17" fill="#0c0c10" />
  <circle cx="352" cy="249" r="7" fill="#ffffff" />
  <circle cx="340" cy="263" r="3.5" fill="#ffffff" opacity="0.65" />

  <!-- White top hat, a little battered. -->
  <use href="#tophat" fill="#1c2436" opacity="0.5" filter="url(#soft)" transform="translate(0 6)" />
  <use href="#tophat" fill="#56627a" stroke="#56627a" stroke-width="6" stroke-linejoin="round" />
  <use href="#tophat" fill="url(#hat)" />
  <path d="M241 188 Q314 200 382 166 L384 182 Q314 216 244 204 Z" fill="url(#band)" />
  <path d="M228 102 Q266 76 322 88 Q352 94 370 84" fill="none" stroke="#e6ebf3" stroke-width="7" stroke-linecap="round" />
  <path d="M262 104 L273 182" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95" />
  <path d="M352 100 L362 170" fill="none" stroke="#8a97b0" stroke-width="8" stroke-linecap="round" opacity="0.5" />

  <!-- The Aero shine: a bright curved band over the top half of the glass. -->
  <path d="M126 36 H386 A90 90 0 0 1 476 126 V200 Q256 268 36 200 V126 A90 90 0 0 1 126 36 Z" fill="url(#shine)" opacity="0.62" />
  <rect x="30" y="30" width="452" height="452" rx="96" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />
</svg>
