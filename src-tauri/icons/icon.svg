<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0ff" />
      <stop offset="0.5" stop-color="#1f8be8" />
      <stop offset="1" stop-color="#0a3f9e" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6ff" />
      <stop offset="1" stop-color="#06296e" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#8fe9ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff59a" />
      <stop offset="0.45" stop-color="#ffd21f" />
      <stop offset="1" stop-color="#e08a00" />
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc21a" />
      <stop offset="1" stop-color="#d97f00" />
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347" />
      <stop offset="1" stop-color="#e2500a" />
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d2e0" />
      <stop offset="0.3" stop-color="#ffffff" />
      <stop offset="0.7" stop-color="#f4f7fb" />
      <stop offset="1" stop-color="#aeb9cb" />
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6b84" />
      <stop offset="0.35" stop-color="#aab6cc" />
      <stop offset="1" stop-color="#4c5870" />
    </linearGradient>
    <clipPath id="inside">
      <rect x="28" y="28" width="456" height="456" rx="104" />
    </clipPath>
    <g id="duck">
      <path d="M96 352 L74 286 L160 330 Z" />
      <ellipse cx="246" cy="384" rx="150" ry="86" />
      <circle cx="316" cy="282" r="82" />
    </g>
    <g id="tophat">
      <ellipse cx="306" cy="212" rx="110" ry="22" transform="rotate(-9 306 212)" />
      <path d="M242 218 L226 118 Q264 92 320 104 Q350 110 368 100 L382 196 Q312 230 242 218 Z" />
    </g>
  </defs>

  <!-- A glossy badge, the way application icons were made in the 2000s. -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#rim)" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#badge)" />
  <g clip-path="url(#inside)">
    <ellipse cx="256" cy="500" rx="300" ry="170" fill="url(#glow)" />
    <!-- Soft shadow under the duck. -->
    <ellipse cx="250" cy="462" rx="150" ry="16" fill="#031b52" opacity="0.45" />
  </g>

  <!-- The duck. -->
  <use href="#duck" fill="#8a4b00" stroke="#8a4b00" stroke-width="14" stroke-linejoin="round" />
  <use href="#duck" fill="url(#body)" />
  <path d="M146 384 Q170 326 250 340 Q292 350 292 384 Q260 436 200 430 Q158 424 146 384 Z" fill="url(#wing)" />
  <path d="M160 372 Q186 340 244 348" fill="none" stroke="#fff3a8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <ellipse cx="286" cy="246" rx="34" ry="20" fill="#ffffff" opacity="0.55" transform="rotate(-24 286 246)" />
  <ellipse cx="200" cy="336" rx="52" ry="14" fill="#ffffff" opacity="0.35" transform="rotate(-14 200 336)" />
  <!-- Beak. -->
  <ellipse cx="408" cy="298" rx="48" ry="24" fill="#8a3200" />
  <ellipse cx="408" cy="298" rx="42" ry="19" fill="url(#beak)" />
  <ellipse cx="400" cy="289" rx="24" ry="6" fill="#ffffff" opacity="0.6" />
  <path d="M368 301 Q408 311 448 299" fill="none" stroke="#a83a00" stroke-width="5" stroke-linecap="round" />
  <!-- Eye. -->
  <circle cx="344" cy="268" r="16" fill="#101014" />
  <circle cx="350" cy="262" r="6" fill="#ffffff" />
  <circle cx="339" cy="274" r="3" fill="#ffffff" opacity="0.6" />

  <!-- White top hat, a little battered. -->
  <use href="#tophat" fill="#3b4354" stroke="#3b4354" stroke-width="14" stroke-linejoin="round" />
  <use href="#tophat" fill="url(#hat)" />
  <path d="M239 202 Q312 214 380 180 L382 196 Q312 230 242 218 Z" fill="url(#band)" />
  <path d="M226 118 Q264 92 320 104 Q350 110 368 100" fill="none" stroke="#dfe5ee" stroke-width="7" stroke-linecap="round" />
  <path d="M262 122 L272 196" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- The shine over the top half of the badge. -->
  <path d="M132 40 H380 A92 92 0 0 1 472 132 V176 Q256 250 40 176 V132 A92 92 0 0 1 132 40 Z" fill="url(#gloss)" opacity="0.55" />
</svg>
