[package]
name = "terminal-app"
description = "Desktop shell of the terminal: window, IPC commands and events."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
term-browser = { path = "../crates/browser" }
term-config = { path = "../crates/config" }
term-history = { path = "../crates/history" }
term-pty = { path = "../crates/pty" }
term-shell = { path = "../crates/shell" }
term-tools = { path = "../crates/tools" }
