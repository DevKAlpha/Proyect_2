# ── Plantilla «Drácula» ─────────────────────────────────────────────────────
# Detallada: fondo morado oscuro y colores muy vivos, fáciles de distinguir
# unos de otros. Colores de la paleta Dracula (draculatheme.com).

[font]
family = "JetBrains Mono, Cascadia Code, Consolas, Menlo, DejaVu Sans Mono, monospace"
size = 14
line_height = 1.25

[cursor]
style = "block"
blink = true

[theme]
preset = "dark"
background = "#282a36"
foreground = "#f8f8f2"
cursor = "#ff79c6"
selection = "#bd93f955"
accent = "#bd93f9"

[theme.ansi]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"
bright_black = "#6272a4"
bright_red = "#ff6e6e"
bright_green = "#69ff94"
bright_yellow = "#ffffa5"
bright_blue = "#d6acff"
bright_magenta = "#ff92df"
bright_cyan = "#a4ffff"
bright_white = "#ffffff"
