# ── Plantilla «Clara» ───────────────────────────────────────────────────────
# Sencilla: fondo claro con tinta gris, más suave que el negro sobre blanco
# de la consola. Una sola línea cambia todos los colores. `preset` elige un tema
# completo y lo demás se queda como estaba.

[theme]
# Tema de partida: "console", "dark", "light" o "high-contrast".
preset = "light"

[cursor]
# Una barra fina se ve mejor que un bloque sobre fondo claro.
style = "bar"
blink = true
