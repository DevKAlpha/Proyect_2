# Terminal: configuración.
# Los cambios se aplican al guardar, sin reiniciar la aplicación.

# Versión del formato de este archivo. No la cambies a mano.
version = 1

# Shell de las pestañas nuevas: "pwsh", "powershell", "cmd", "git-bash", "wsl",
# "bash", "zsh" o "fish". Sin valor se usa el primero que se encuentre.
# default_shell = "pwsh"

# Líneas de historial que guarda cada pestaña.
scrollback = 5000

[font]
# Se usa la primera fuente de la lista que esté disponible. JetBrains Mono
# viene incluida en la terminal; las demás deben estar instaladas en el equipo.
family = "JetBrains Mono, Cascadia Code, Consolas, Menlo, DejaVu Sans Mono, monospace"
# Tamaño base. Ctrl + y Ctrl - lo cambian mientras trabajas; Ctrl 0 vuelve a este valor.
size = 14
# Alto de cada línea, como múltiplo del tamaño de la fuente.
line_height = 1.2

[theme]
# Colores en hexadecimal: #RRGGBB, o #RRGGBBAA con transparencia.
background = "#14161b"
foreground = "#d7dae0"
cursor = "#8ab4f8"
selection = "#8ab4f84d"
# Color de la pestaña activa y del foco.
accent = "#8ab4f8"

# Agentes de IA y herramientas propias. Aparecen en el menú de pestaña nueva
# (la flecha junto al +). Los agentes conocidos (Claude Code, Codex, Gemini CLI,
# OpenCode, GitHub Copilot CLI) se detectan solos; aquí van los demás.
# Quita los "#" y repite el bloque por cada uno:
#
# [[agents]]
# name = "Aider"
# command = "aider"
