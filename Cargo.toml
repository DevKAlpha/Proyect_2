[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Shared versions so every crate moves together.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Small installer and fast start matter more than build time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
